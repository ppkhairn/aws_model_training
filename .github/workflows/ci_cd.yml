name: Deploy Training Infrastructure v0.0.7

on:
  push:
    branches:
      - main

permissions:
  id-token: write  
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout your repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # 3. Package and Upload Training Code to S3
      - name: Package and Upload Training Code to S3
        run: |
          # Go to the directory where your train.py lives
          cd src/aws_model_training/
          
          # Create the tarball containing train.py
          tar -czvf sourcedir.tar.gz train.py
          
          # Upload it to your training code bucket
          aws s3 cp sourcedir.tar.gz s3://training-pk/code/sourcedir.tar.gz

      # 4. Deploy CloudFormation Stack
      - name: Deploy CloudFormation Stack
        uses: aws-actions/aws-cloudformation-github-deploy@v1
        with:
          name: training-infrastructure-stack-3
          template: aws/template_2.yaml  
          capabilities: CAPABILITY_NAMED_IAM
          parameter-overrides: |
            DataS3BucketName=customer-data-pushkar-khairnar-108372347,
            TrainingCodeBucketName=training-pk,
            TrainingImageUri=763104351884.dkr.ecr.us-east-1.amazonaws.com/pytorch-training:2.3-gpu-py311