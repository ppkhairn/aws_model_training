name: Deploy Training Infrastructure v0.0.5

on:
  push:
    branches:
      - main

permissions:
  id-token: write  # Fixed typo here (required for AWS OIDC token exchange if using roles)
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout your repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # 3. Deploy CloudFormation Stack
      - name: Deploy CloudFormation Stack
        uses: aws-actions/aws-cloudformation-github-deploy@v1
        with:
          name: training-infrastructure-stack-2
          template: aws/template.yaml  # Adjust this path if your template is inside a folder (e.g., infra/template.yaml)
          capabilities: CAPABILITY_NAMED_IAM
          parameter-overrides: |
            DataS3BucketName=customer-data-pushkar-khairnar-108372347,
            TrainingCodeBucketName=training-pk