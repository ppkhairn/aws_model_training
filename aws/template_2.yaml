AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Fully dynamic, reusable CloudFormation template for SageMaker Training Jobs.

Parameters:
  DataS3BucketName:
    Type: String
    Description: Name of the S3 bucket holding training data and outputs.
  TrainingCodeBucketName:
    Type: String
    Description: Name of the S3 bucket holding the source code tarball.
  TrainingImageUri:
    Type: String
    Default: '763104351884.dkr.ecr.us-east-1.amazonaws.com/pytorch-training:2.3-gpu-py311'
    Description: ECR URI for the PyTorch training container.

Resources:
  # 1. IAM Role for SageMaker Execution
  AmazonSageMakerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: sagemaker.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSageMakerFullAccess
        - arn:aws:iam::aws:policy/CloudWatchEventsFullAccess
      Policies:
        - PolicyName: SageMaker-S3-Data-Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::${DataS3BucketName}"
                  - !Sub "arn:aws:s3:::${DataS3BucketName}/*"
                  - !Sub "arn:aws:s3:::${TrainingCodeBucketName}"
                  - !Sub "arn:aws:s3:::${TrainingCodeBucketName}/*"

  # 2. IAM Role for Lambda Function
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
        - arn:aws:iam::aws:policy/AmazonSageMakerFullAccess
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  # 3. Dynamic Lambda Function
  TrainingLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 60
      Code:
        ZipFile: !Sub |
          import boto3
          import datetime
          import json

          def lambda_handler(event, context):
              sagemaker = boto3.client('sagemaker')
              
              # Parse incoming request body from API Gateway
              body = {}
              if 'body' in event:
                  try:
                      body = json.loads(event['body'])
                  except:
                      body = {}
              
              # Extract dynamic parameters or fall back to defaults
              task_name = body.get('task_name', 'classification')
              s3_input_uri = body.get('s3_input_path', 's3://${DataS3BucketName}/images/')
              s3_output_uri = body.get('s3_output_path', 's3://${DataS3BucketName}/output/')
              
              # Construct dynamic job name: e.g., cat_dog_classification_2026-08-31-18-00-00
              timestamp = datetime.datetime.now().strftime('%Y-%m-%d-%H-%M-%S')
              job_name = f"{task_name}-{timestamp}"
              
              sagemaker.create_training_job(
                  TrainingJobName=job_name,
                  AlgorithmSpecification={
                      'TrainingImage': '${TrainingImageUri}',
                      'TrainingInputMode': 'File'
                  },
                  RoleArn='${AmazonSageMakerExecutionRole.Arn}',
                  InputDataConfig=[{
                      'ChannelName': 'training',
                      'DataSource': {'S3DataSource': {
                          'S3DataType': 'S3Prefix',
                          'S3Uri': s3_input_uri,
                          'S3DataDistributionType': 'FullyReplicated'
                      }}
                  }],
                  OutputDataConfig={'S3OutputPath': s3_output_uri},
                  ResourceConfig={
                      'InstanceType': 'ml.m5.large',
                      'InstanceCount': 1,
                      'VolumeSizeInGB': 30
                  },
                  StoppingCondition={'MaxRuntimeInSeconds': 3600},
                  HyperParameters={
                      "sagemaker_program": "train.py",
                      "sagemaker_submit_directory": "s3://${TrainingCodeBucketName}/code/sourcedir.tar.gz"
                  }
              )
              return {
                  "statusCode": 200,
                  "body": json.dumps({
                      "status": "Training Initiated Successfully",
                      "job_name": job_name,
                      "input_path": s3_input_uri,
                      "output_path": s3_output_uri
                  })
              }

  # 4. API Gateway (HTTP API)
  TrainingApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: training-trigger-api
      ProtocolType: HTTP

  # 5. Integration
  ApiLambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref TrainingApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt TrainingLambdaFunction.Arn
      PayloadFormatVersion: '2.0'

  # 6. Route for /train
  TrainingApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref TrainingApi
      RouteKey: 'ANY /train'
      AuthorizationType: NONE
      Target: !Sub "integrations/${ApiLambdaIntegration}"

  # 7. Stage
  TrainingApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref TrainingApi
      StageName: '$default'
      AutoDeploy: true

  # 8. Permission
  LambdaApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref TrainingLambdaFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}{$TrainingApi}/*/*/train"

Outputs:
  ApiEndpoint:
    Description: "HTTP API endpoint URL to trigger training"
    Value: !GetAtt TrainingApi.ApiEndpoint